name: generate pacman game

# Run daily at 01:00 AM UTC
on:
  schedule:
    - cron: "0 01 * * *"
  workflow_dispatch:

jobs:
  pacman:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Generate pacman contribution animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # push the content of  to a branch
      # the content will be available at https://raw.githubusercontent.com//// , or as github page
      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
